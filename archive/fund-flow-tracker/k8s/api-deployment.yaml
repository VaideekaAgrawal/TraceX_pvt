# TraceX API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracex-api
  labels:
    app: tracex
    component: api
    version: v3.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tracex
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tracex
        component: api
        version: v3.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tracex-api
      containers:
      - name: api
        image: tracex/api:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        env:
        - name: DB_BACKEND
          value: "neo4j"
        - name: NEO4J_URI
          valueFrom:
            secretKeyRef:
              name: tracex-secrets
              key: neo4j-uri
        - name: NEO4J_USER
          valueFrom:
            secretKeyRef:
              name: tracex-secrets
              key: neo4j-user
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tracex-secrets
              key: neo4j-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: tracex-secrets
              key: jwt-secret
        - name: ALLOWED_ORIGINS
          value: "https://tracex.unionbank.com,https://tracex-internal.unionbank.com"
        - name: LOG_LEVEL
          value: "INFO"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /app/data
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: tracex-data-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: tracex
                  component: api
              topologyKey: kubernetes.io/hostname
---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: tracex-api
  labels:
    app: tracex
    component: api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  selector:
    app: tracex
    component: api
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tracex-api-hpa
  labels:
    app: tracex
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tracex-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 4
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tracex-api-pdb
  labels:
    app: tracex
    component: api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: tracex
      component: api
---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracex-api
  labels:
    app: tracex
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracex-ingress
  labels:
    app: tracex
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - tracex.unionbank.com
    secretName: tracex-tls
  rules:
  - host: tracex.unionbank.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: tracex-api
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tracex-frontend
            port:
              number: 80
