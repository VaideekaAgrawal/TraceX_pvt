[project]
name = "tracex-backend"
version = "0.1.0"
description = "TraceX AML investigation platform — greenfield backend (detection / investigation / orchestration layers)"
requires-python = ">=3.11"
dependencies = [
    # Phase 0-2 needs only: web framework, config/validation, persistence, auth.
    # ML/graph libs (pandas, numpy, networkx, scikit-learn, xgboost) and the
    # LLM client (httpx-based) are added when the phase that uses them lands
    # (Phase 3 detection port; Phase 8 AI substrate) — not before. Pulling
    # them in early caused real dependency-resolution friction with no
    # offsetting benefit (see docs/SESSION_LOG.md).
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 (unmaintained since 2020) reads bcrypt.__about__.__version__
    # to detect its backend; that attribute was removed in bcrypt>=4.1, which
    # makes CryptContext(schemes=["bcrypt"]).hash() raise AttributeError.
    # Pinned below 4.1 until passlib is replaced or fixed upstream — verified
    # this pin actually works (hash+verify round-trip) before committing.
    "bcrypt<4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic revision scripts are machine-generated by `alembic revision
# --autogenerate` (see backend/alembic/env.py) and are meant to stay as
# close to that output as possible for auditability — hand-reformatting
# long `sa.Enum(...)`/`sa.ForeignKeyConstraint(...)` lines or rewriting
# their `Optional[...]`-style type hints to satisfy lint rules would make
# `git diff` against the next autogenerate noisier, not cleaner, with no
# runtime benefit. Same convention many SQLAlchemy/Alembic projects use.
"alembic/versions/*.py" = ["E501", "UP006", "UP007", "UP035", "I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
# `files` here only applies when mypy is invoked with no path arguments.
# CI and the README both invoke mypy with explicit package names (not `.`)
# for the same reason this list exists: an `exclude` regex only protects
# against a venv named exactly what the regex expects (e.g. `.venv`) — a
# venv with any other name (`venv/`, `env/`, `.venv311/`) would still get
# walked and type-checked as if it were our own source, which is what
# actually happened during this repo's own Phase 0 session.
files = ["foundation", "detection", "investigation", "orchestration", "api", "db", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["foundation*", "detection*", "investigation*", "orchestration*", "api*", "db*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
