[project]
name = "tracex-backend"
version = "0.1.0"
description = "TraceX AML investigation platform — greenfield backend (detection / investigation / orchestration layers)"
requires-python = ">=3.11"
dependencies = [
    # Phase 0-2 needs only: web framework, config/validation, persistence, auth.
    # ML/graph libs (pandas, numpy, networkx, scikit-learn, xgboost) and the
    # LLM client (httpx-based) are added when the phase that uses them lands
    # (Phase 3 detection port; Phase 8 AI substrate) — not before. Pulling
    # them in early caused real dependency-resolution friction with no
    # offsetting benefit (see docs/SESSION_LOG.md).
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["^\\.venv/", "^build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["foundation*", "detection*", "investigation*", "orchestration*", "api*", "db*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
