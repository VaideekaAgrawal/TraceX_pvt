# TEMPLATE ONLY — do not commit real secret values.
#
# The Deployment (api-deployment.yaml) reads every secret from a Secret named
# `tracex-secrets` via secretKeyRef. Create it out-of-band (sealed-secrets,
# external-secrets, or `kubectl create secret`), never from a committed file
# with real values. This template documents the required keys.
#
# Example (do this with real values, not in git):
#   kubectl create secret generic tracex-secrets \
#     --from-literal=database-url='sqlite:////app/data/tracex.db' \
#     --from-literal=jwt-secret='<32+ byte random>' \
#     --from-literal=openrouter-api-key='<key>' \
#     --from-literal=pii-hmac-key='<32+ byte random>'
apiVersion: v1
kind: Secret
metadata:
  name: tracex-secrets
  labels: {app: tracex}
type: Opaque
stringData:
  # For a real multi-replica deployment this should point at a shared/managed
  # database, not a per-pod SQLite file — SQLite is the pilot default.
  database-url: "sqlite:////app/data/tracex.db"
  jwt-secret: "CHANGE_ME"          # 32+ bytes of randomness; app rejects empty in prod
  openrouter-api-key: "CHANGE_ME"  # required in prod (AI surfaces) — validate_secrets() enforces
  pii-hmac-key: "CHANGE_ME"        # 32+ bytes; keys the PII tokenization HMAC
