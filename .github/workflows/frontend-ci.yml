name: frontend-ci

on:
  push:
    # Mirrors backend-ci.yml: must run on phase branches too, not just the
    # PR that eventually targets main, or a regression can sit on a phase
    # branch for an entire session unnoticed.
    branches: [main, "phase/**"]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No `|| true` on any step (ROADMAP Phase 22, mirrors the backend-ci.yml
      # landmine fix from Phase 12) — a pipeline that can't fail misrepresents
      # quality. This is also this repo's first frontend CI workflow: the prior
      # ci.yml with `|| true` only ever existed pre-refactor (see archive/).
      - name: Lint (eslint)
        run: npm run lint

      # Next.js runs TypeScript type-checking as part of `next build` (no
      # ignoreBuildErrors set in next.config.ts), so build doubles as the
      # typecheck gate — matching what every prior frontend session already
      # verified locally via `npm run lint && npm run build`.
      - name: Typecheck + build (next build)
        run: npm run build
